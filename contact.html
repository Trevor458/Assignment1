<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css" media="(max-width: 480px)">
    <link rel="stylesheet" href="tablet.css" media="(min-width: 481px) and (max-width: 959px)">
    <link rel="stylesheet" href="laptop.css" media="(min-width: 960px)">
</head>
<body>
    <div class="logo">
        <a href="home.html"><img src="me.jfif"></a>
    </div>
    <nav class="navbar"> <!--Top Navigation bar-->
        <div class="nav-links">
            <a href="about_me.html">About Me</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact Me</a>
        </div>
    </nav>

    <header class="hero">
         <h1>Contact Me</h1>
    </header>
    <section class="form">

        <p>Fill the form and leave a comment, so I can get back to you as soon as possible.</p>
        <form action="mailto:oghenetano.osokpor@ontariotechu.net?subject=Feedback on website"
                method="post" enctype="text/plain" name="feedback_form">
            <p>
                <label for="Fname">First Name: </label>
                <input type="text" name="Fname" size="32" placeholder="Enter your first name" required>
            </p>
            <p>
                <label for="Lname">Last Name: </label>
                <input type="text" name="Lname" size="32" placeholder="Enter your last name" required>
            </p>
            <p>
                <label for="email">Email: </label>
                <input type="email" name="email" size="32" placeholder="Enter your email address" required>
            </p>
            <p>
                <label for="DoB">Date of Birth</label>
                <input type="date" name="DoB">
            </p>
            <p>
                <label for="comments">Comments</label><br>
                <textarea name="comments" cols="60" rows="6"></textarea>
            </p>
            <input type="reset" value="Reset">
            <input type="submit" value="Submit">
        </form>
    </section>
    <div id="footer">
        <p>&copy; 2026 Oghenetano Osokpor | oghenetano.osokpor@ontariotechu.net</p>
    </div>
</body>
</html>
